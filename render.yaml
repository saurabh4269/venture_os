# Render — alternative to Fly for api + worker. Free/hobby friendly.
# Secrets are set in the dashboard — never committed. sync: false = operator fills in.
#
# Free web services sleep after 15 minutes idle. Keep-alive (portable, $0):
# GET /health every 10 minutes from UptimeRobot / cron-job.org, or GET the
# Vercel origin /api/health (same-origin BFF → this API). A Render cron that
# curls /health is $1/month — optional; see docs/cost-hosting.md.

services:
  - type: web
    name: venture-os-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm i && pnpm --filter @venture-os/db migrate
    startCommand: pnpm --filter @venture-os/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: WEB_ORIGIN_PATTERNS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: GIT_SHA
        sync: false

  - type: worker
    name: venture-os-worker
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm i
    startCommand: pnpm --filter @venture-os/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
